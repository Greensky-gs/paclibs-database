name: Mirror main to mirror branch

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "Forgejo Actions"
          git config user.email "actions@forgejo.local"

      - name: Prepare mirror branch
        run: |
          if git show-ref --verify --quiet refs/heads/mirror; then
            git checkout mirror
            git merge --no-edit main
          else
            git checkout --orphan mirror
          fi

      - name: Remove unwanted files
        run: |
          if [ -f README.md ]; then
            git rm -f README.md || true
          fi

          WORKFLOW_FILE=".forgejo/workflows/sync.yml"
          if [ -f "$WORKFLOW_FILE" ]; then
            git rm -f "$WORKFLOW_FILE" || true
          fi

      - name: Commit changes on mirror
        run: |
          # S'assurer qu'on est bien sur mirror
          git checkout mirror

          # Commit même s'il n'y a que des suppressions
          git add -A
          git commit -m "Sync main -> mirror (without README and workflow)" \
            || git commit --allow-empty -m "Sync main -> mirror (no changes)"

      - name: Push to mirror branch
        env:
          FORGEJO_TOKEN: ${{ secrets.WRITE_REPO_TOKEN }}
        run: |
          REMOTE_URL=$(git remote get-url origin)
          AUTH_URL=$(echo "$REMOTE_URL" | sed -E 's#^(https?://)#\1${FORGEJO_TOKEN}:@#')
          git remote set-url origin "$AUTH_URL"

          git push --force origin HEAD:mirror
