name: Mirror main to mirror branch

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: arch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        id: config
        env:
          REPO: ${{ github.repository }}
        run: |
          git config user.name "Forgejo Actions"
          git config user.email "actions@forgejo.local"

          printf 'repo=`%s`' "${REPO#*/}" >> "$GITHUB_OUTPUT"

          pacman -Sy --noconfirm jq

      - name: Create / update mirror branch locally
        run: |
          git checkout main

          git checkout --orphan mirror

          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true

          git checkout main -- .

      - name: Remove unwanted files
        run: |
          if [ -f README.md ]; then
            git rm -f README.md || true
          fi

          WORKFLOW_FILE=".forgejo/workflows/sync.yml"
          if [ -f "$WORKFLOW_FILE" ]; then
            git rm -f "$WORKFLOW_FILE" || true
          fi

      - name: Commit changes on mirror
        run: |
          git add -A
          git commit -m "Sync main -> mirror (without README and workflow)" \
            || git commit --allow-empty -m "Sync main -> mirror (no changes)"

      - name: Push to mirror branch
        env:
          FORGEJO_TOKEN: ${{ secrets.WRITE_REPO_TOKEN }}
        run: |
          REMOTE_URL=$(git remote get-url origin)
          AUTH_URL=$(echo "$REMOTE_URL" | sed -E 's#^(https?://)#\1${FORGEJO_TOKEN}:@#')
          git remote set-url origin "$AUTH_URL"

          git push --force origin HEAD:mirror

      - name: Send webhook data
        uses: ./.forgejo/actions/discord-notify
        with:
          webhook_url: ${{ secrets.webhook_url }}
          bot_name: ${{ github.repository }}
          title: 'Mirror synchronized'
          title_url: ${{ github.server_url }}/${{ github.repository }}
          color: '1896637'
          footer_text: 'Forgejo Actions'
          footer_icon_url: 'https://git.greensky.tf/Greensky/assets/raw/commit/82192bec488323e1c988f38d9043b71e1aed0f88/logos/forgejo/logo.png'
          bot_avatar_url: 'https://git.greensky.tf/Greensky/assets/raw/commit/091acdcdd021a2750e2ee9d4877ef715656dc8a5/avatars/mirror.png'
          description: |
            The [${{ steps.config.outputs.repo }}](${{ github.server_url }}/${{ github.repository }}) repository synced its [**pacboy Mirror**](${{ github.server_url }}/${{ github.repository }}/src/branch/mirror)

            See [`pacboy`](${{ github.server_url }}/Greensky/pacboy)
